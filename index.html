<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menú de productos</title>
   
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/responsive.css" media="(max-width: 768px)">
    </head>
    <body>
        <main>
            <h1>Menú de Productos</h1>
            
            <form class="formulario-menu">
                <select id="menu">
                    <option value="">Seleccione un producto</option>
                    <option value="1">Helado</option>
                    <option value="2">Hamburguesa</option>
                    <option value="3">Perro caliente</option>
                    <option value="4">Ensalada</option>
                </select>
                <button type="submit" id="btn" class="btn">Ver precio</button>
            </form>
            <div id="item" class="item"></div>
        </main>
        <script type="module" src="javascript/main.js"></script>
    </body>
    </html>
